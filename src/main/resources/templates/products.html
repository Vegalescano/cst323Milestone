<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">CST323Inventory</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">Dashboard</a>

            <a class="nav-link"
               th:if="${session.loggedInRole == 'ADMIN' or session.loggedInRole == 'EMPLOYEE'}"
               href="/products">Products</a>

            <a class="nav-link"
               th:if="${session.loggedInRole == 'ADMIN' or session.loggedInRole == 'EMPLOYEE'}"
               href="/customers">Customers</a>

            <a class="nav-link"
               th:if="${session.loggedInRole == 'ADMIN' or session.loggedInRole == 'EMPLOYEE' or session.loggedInRole == 'MANAGER'}"
               href="/orders">Orders</a>

            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1 class="page-title">Products</h1>
    <p class="small-note">
        This page handles product create, read, update, and delete/deactivate.
    </p>

    <!-- Add/Edit Product Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <strong th:text="${product.productId == null ? 'Add Product' : 'Edit Product'}">
                Add Product
            </strong>
        </div>

        <div class="card-body">
            <form th:action="@{/products/save}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{productId}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Product Name</label>
                        <input class="form-control" th:field="*{productName}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Description</label>
                        <input class="form-control" th:field="*{description}">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Price</label>
                        <input class="form-control" type="number" step="0.01" th:field="*{price}" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Quantity</label>
                        <input class="form-control" type="number" th:field="*{quantityInStock}" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Reorder Level</label>
                        <input class="form-control" type="number" th:field="*{reorderLevel}" required>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{active}">
                            <label class="form-check-label">Active</label>
                        </div>
                    </div>

                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-primary me-2" type="submit">Save</button>
                        <a class="btn btn-outline-secondary" href="/products">Clear</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Search Form -->
    <form class="row g-2 mb-3" method="get" action="/products">
        <div class="col-md-10">
            <input class="form-control" name="search" th:value="${search}" placeholder="Search products...">
        </div>

        <div class="col-md-2">
            <button class="btn btn-outline-primary w-100" type="submit">Search</button>
        </div>
    </form>

    <!-- Product Table -->
    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Reorder</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item : ${products}">
                    <td th:text="${item.productId}">1</td>
                    <td th:text="${item.productName}">Product</td>
                    <td th:text="${item.description}">Description</td>
                    <td th:text="${item.price}">0.00</td>
                    <td th:text="${item.quantityInStock}">0</td>
                    <td th:text="${item.reorderLevel}">0</td>
                    <td class="table-actions">
                        <a th:href="@{/products/edit/{id}(id=${item.productId})}">Edit</a>
                        <a th:href="@{/products/delete/{id}(id=${item.productId})}"
                           onclick="return confirm('Deactivate product?')">
                            Delete
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="7" class="text-center">
                        No products found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
