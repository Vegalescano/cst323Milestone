<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">CST323Inventory</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">Dashboard</a>

            <a class="nav-link"
               th:if="${session.loggedInRole == 'ADMIN' or session.loggedInRole == 'EMPLOYEE'}"
               href="/products">Products</a>

            <a class="nav-link"
               th:if="${session.loggedInRole == 'ADMIN' or session.loggedInRole == 'EMPLOYEE'}"
               href="/customers">Customers</a>

            <a class="nav-link"
               th:if="${session.loggedInRole == 'ADMIN' or session.loggedInRole == 'EMPLOYEE' or session.loggedInRole == 'MANAGER'}"
               href="/orders">Orders</a>

            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1 class="page-title">Customers</h1>
    <p class="small-note">
        This one page handles customer create, read, update, and delete.
    </p>
	<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

	<div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <strong th:text="${customer.customerId == null ? 'Add Customer' : 'Edit Customer'}">Add Customer</strong>
        </div>

        <div class="card-body">
            <form th:action="@{/customers/save}" th:object="${customer}" method="post">
                <input type="hidden" th:field="*{customerId}">

                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">First Name</label>
                        <input class="form-control" th:field="*{firstName}" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Last Name</label>
                        <input class="form-control" th:field="*{lastName}" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" th:field="*{email}" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Phone</label>
                        <input class="form-control" th:field="*{phone}">
                    </div>

                    <div class="col-md-9">
                        <label class="form-label">Address</label>
                        <input class="form-control" th:field="*{address}">
                    </div>

                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-primary me-2" type="submit">Save</button>
                        <a class="btn btn-outline-secondary" href="/customers">Clear</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <form class="row g-2 mb-3" method="get" action="/customers">
        <div class="col-md-10">
            <input class="form-control" name="search" th:value="${search}" placeholder="Search customers...">
        </div>

        <div class="col-md-2">
            <button class="btn btn-outline-primary w-100" type="submit">Search</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item : ${customers}">
                    <td th:text="${item.customerId}">1</td>
                    <td th:text="${item.fullName}">Name</td>
                    <td th:text="${item.email}">email</td>
                    <td th:text="${item.phone}">phone</td>
                    <td th:text="${item.address}">address</td>
                    <td class="table-actions">
                        <a th:href="@{/customers/edit/{id}(id=${item.customerId})}">Edit</a>
                        <a th:href="@{/customers/delete/{id}(id=${item.customerId})}"
                           onclick="return confirm('Delete customer?')">Delete</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="6" class="text-center">
                        No customers found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
