<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">CST323Inventory</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">Dashboard</a>

            <a class="nav-link"
               th:if="${session.loggedInRole == 'ADMIN' or session.loggedInRole == 'EMPLOYEE'}"
               href="/products">Products</a>

            <a class="nav-link"
               th:if="${session.loggedInRole == 'ADMIN' or session.loggedInRole == 'EMPLOYEE'}"
               href="/customers">Customers</a>

            <a class="nav-link"
               th:if="${session.loggedInRole == 'ADMIN' or session.loggedInRole == 'EMPLOYEE' or session.loggedInRole == 'MANAGER'}"
               href="/orders">Orders</a>

            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1 class="page-title">Orders</h1>
    <p class="small-note">
        This one page creates orders, lists order records, shows order items, and updates order status.
    </p>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <strong>Create Order</strong>
        </div>

        <div class="card-body">
            <form action="/orders/save" method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Customer</label>
                        <select class="form-select" name="customerId" required>
                            <option th:each="customer : ${customers}"
                                    th:value="${customer.customerId}"
                                    th:text="${customer.fullName}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Product</label>
                        <select class="form-select" name="productId" required>
                            <option th:each="product : ${products}"
                                    th:value="${product.productId}"
                                    th:text="${product.productName + ' - Qty: ' + product.quantityInStock}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Quantity</label>
                        <input class="form-control" type="number" name="quantity" min="1" value="1" required>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-primary w-100" type="submit">Create</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.orderId}">1</td>
                    <td th:text="${order.customer.fullName}">Customer</td>
                    <td th:text="${order.orderDate}">Date</td>

                    <td>
                        <div th:each="item : ${order.orderItems}"
                             th:text="${item.product.productName + ' x ' + item.quantity + ' = $' + item.lineTotal}">
                            Item
                        </div>
                    </td>

                    <td th:text="${order.totalAmount}">0.00</td>

                    <td>
                        <form th:action="@{/orders/{id}/status(id=${order.orderId})}" method="post" class="d-flex gap-2">
                            <select class="form-select form-select-sm" name="status">
                                <option th:selected="${order.status == 'Pending'}">Pending</option>
                                <option th:selected="${order.status == 'Processing'}">Processing</option>
                                <option th:selected="${order.status == 'Completed'}">Completed</option>
                                <option th:selected="${order.status == 'Canceled'}">Canceled</option>
                            </select>

                            <button class="btn btn-sm btn-outline-primary" type="submit">Update</button>
                        </form>
                    </td>

                    <td>
                        <a th:href="@{/orders/delete/{id}(id=${order.orderId})}"
                           onclick="return confirm('Delete order?')">Delete</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="7" class="text-center">
                        No orders found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
