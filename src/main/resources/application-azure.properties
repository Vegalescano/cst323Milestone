spring.application.name=CST323Inventory

# Azure App Service port support:
# Windows App Service often uses HTTP_PLATFORM_PORT.
# Linux Java App Service often uses PORT/SERVER_PORT.
server.port=${HTTP_PLATFORM_PORT:${PORT:${SERVER_PORT:8080}}}

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.h2.console.enabled=false

# Milestone 4 logging
logging.level.root=INFO
logging.level.com.gcu.cst323.inventory=INFO
spring.aop.proxy-target-class=true